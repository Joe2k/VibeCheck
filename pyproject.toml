[project]
name = "vibecheck"
version = "0.1.0"
description = "Slang-aware vibe search for San Francisco cafes, restaurants and bars."
requires-python = ">=3.11,<3.12"
dependencies = [
    "en-core-web-sm",
    "kaggle>=2.2.5",
    "keybert>=0.9.0",
    "matplotlib>=3.11.2",
    "orjson>=3.13.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "sentence-transformers>=6.2.0",
    "spacy>=3.8.18",
    "tabulate>=0.10.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "poethepoet>=0.29.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Same commands on macOS and Windows: `uv run poe <task>` (`uv run poe` lists them).
[tool.poe.tasks]
data = { sequence = ["_places_reviews", "_urban_dictionary", "_wiktionary"], help = "SF places + reviews, Urban Dictionary, Wiktionary slang (~1 h, mostly streaming). Skips what exists." }
stats = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 notebooks/00_build_data.ipynb notebooks/01_sf_stats.ipynb notebooks/02_slang.ipynb notebooks/03_tag_queries.ipynb", deps = ["data"], help = "Notebooks 00-03; writes reports/numbers.md" }
features = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 notebooks/04_features.ipynb", deps = ["data"], help = "Notebook 04: feature prototype on 3 places" }
test = { cmd = "pytest -q", help = "Unit tests" }
lint = { sequence = ["ruff check src tests notebooks", "ruff format --check src tests"], default_item_type = "cmd", help = "Ruff lint + format check" }
_places_reviews = "python -m vibecheck.filter_sf"
_urban_dictionary = "python -m vibecheck.lexicon"
_wiktionary = "python -m vibecheck.wiktionary"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]  # markdown-building f-strings in notebooks are prose
