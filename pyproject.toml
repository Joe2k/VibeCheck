[project]
name = "vibecheck"
version = "0.1.0"
description = "Slang-aware vibe search for San Francisco cafes, restaurants and bars."
requires-python = ">=3.11,<3.12"
dependencies = [
    "en-core-web-sm",
    "kaggle>=2.2.5",
    "keybert>=0.9.0",
    "matplotlib>=3.11.2",
    "orjson>=3.13.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "sentence-transformers>=6.2.0",
    "spacy>=3.8.18",
    "tabulate>=0.10.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
    "wordfreq>=3.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]  # markdown-building f-strings in notebooks are prose
